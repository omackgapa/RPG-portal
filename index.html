<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 포털</title>
    <style>
        * { box-sizing: border-box; } 

        body { margin: 0; background-color: #121212; color: #eeeeee; font-family: 'Apple SD Gothic Neo', sans-serif; }
        
        .container { padding: 25px 15px 15px 15px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #00ea90; }
        .card p { line-height: 1.6; margin: 5px 0; font-size: 15px; }
        .highlight { color: #00ea90; font-weight: bold; }

        .profile-img-container { text-align: center; margin: 15px 0; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00ea90; object-fit: cover; transition: all 0.5s ease; }

        .exp-bar-bg { background-color: #333; border-radius: 10px; height: 16px; width: 100%; overflow: hidden; margin-top: 15px; }
        .exp-bar-fill { background-color: #00ea90; height: 100%; width: 0%; transition: width 0.3s ease-in-out; }
        .exp-text { font-size: 12px; text-align: right; margin-top: 5px; color: #aaa; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .action-btn { background-color: transparent; color: #00ea90; border: 1px solid #00ea90; padding: 10px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .action-btn:active { background-color: #00ea90; color: #121212; }

        .custom-task-wrapper { margin-top: 25px; border-top: 1px dashed #444; padding-top: 15px; }
        .toggle-btn { width: 100%; padding: 12px; border-radius: 8px; background-color: #222; color: #00ea90; border: 1px dashed #00ea90; font-weight: bold; font-size: 14px; cursor: pointer; }
        
        .custom-task-form { background-color: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .task-input { flex: 2; padding: 12px; font-size: 14px; border-radius: 5px; border: 1px solid #444; background-color: #222; color: #fff; width: 100%; }
        .exp-input { flex: 1; padding: 12px; font-size: 14px; border-radius: 5px; border: 1px solid #444; background-color: #222; color: #fff; text-align: center; width: 100%; }
        
        .form-btns { display: flex; gap: 10px; }
        .form-btns button { flex: 1; padding: 12px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .submit-btn { background-color: #00ea90; color: #121212; }
        .cancel-btn { background-color: #333; color: #aaa; }

        .full-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
        .name-input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #333; background-color: #1a1a1a; color: #fff; margin: 20px 0; width: 80%; max-width: 250px; text-align: center; }
        .start-btn { background-color: #00ea90; color: #121212; border: none; padding: 14px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; max-width: 280px; }
        .outline-btn { background-color: transparent; color: #00ea90; border: 2px solid #00ea90; padding: 14px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; max-width: 280px; }
    </style>
</head>
<body>

    <div id="intro-screen" class="full-screen">
        <h1 style="color: #00ea90; margin-bottom: 10px;">시스템 접속</h1>
        <p>포털에 사용할 닉네임을 입력하세요.</p>
        <input type="text" id="nickname-input" class="name-input" placeholder="닉네임 (예: 심상치않은 플레이어)">
        <button class="start-btn" onclick="goToModeSelect()">다음 단계로</button>
    </div>

    <div id="mode-select-screen" class="full-screen" style="display: none;">
        <h1 style="color: #00ea90; margin-bottom: 10px;">퀘스트 세팅</h1>
        <p><strong id="welcome-name" class="highlight"></strong>님, 환영합니다!<br>퀘스트 세팅 방식을 골라주세요.</p>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
            <button class="start-btn" onclick="startPortal('default')">기본 템플릿 사용하기</button>
            <button class="outline-btn" onclick="startPortal('custom')">나만의 세팅으로 시작하기</button>
        </div>
    </div>

    <div id="main-portal" style="display: none;">
        <div class="container">
            <div class="card">
                <h2>내 프로필</h2>
                <p>안녕하세요! <strong id="display-name" class="highlight"></strong>의 모바일 개인 포털입니다.</p>
                <div class="profile-img-container">
                    <img id="rank-image" class="profile-img" src="https://via.placeholder.com/100/1a1a1a/00ea90?text=초보자" alt="계급 이미지">
                </div>
                <p style="text-align: center;">현재 상태 : <span id="rank-text" class="highlight" style="font-size: 18px;">초보자</span></p>
                <p style="text-align: center; margin-top: 15px;">
                    <button onclick="resetData()" style="background:none; border:none; color:#ff4444; text-decoration:underline; cursor:pointer; font-size:12px;">🔄 진행상황 초기화</button>
                </p>
            </div>

            <div class="card">
                <h2><span id="rpg-name" style="color: #fff;"></span>의 상태창</h2>
                <p>현재 레벨 : <span id="level-display" class="highlight" style="font-size: 20px;">Lv. 1</span></p>
                
                <div class="exp-bar-bg">
                    <div id="exp-bar-fill" class="exp-bar-fill"></div>
                </div>
                <div id="exp-text" class="exp-text">0 / 100 EXP</div>

                <div id="action-buttons" class="btn-group">
                    </div>

                <div class="custom-task-wrapper">
                    <button id="toggle-form-btn" class="toggle-btn" onclick="toggleTaskForm()">➕ 새 퀘스트 만들기</button>
                    
                    <div id="custom-task-form" class="custom-task-form" style="display: none;">
                        <p style="font-size: 14px; color: #00ea90; margin: 0 0 10px 0;">어떤 퀘스트를 추가할까요?</p>
                        <div class="input-group">
                            <input type="text" id="new-task-name" class="task-input" placeholder="퀘스트 이름 (예: 게임 한판)">
                            <input type="number" id="new-task-exp" class="exp-input" placeholder="EXP (예: 50)">
                        </div>
                        <div class="form-btns">
                            <button class="submit-btn" onclick="addCustomTask()">✔ 추가완료</button>
                            <button class="cancel-btn" onclick="toggleTaskForm()">❌ 취소</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const rankSystem = [
            { level: 100, title: "전설 (Legend)", img: "https://via.placeholder.com/100/1a1a1a/ffcc00?text=전설" },
            { level: 90, title: "그랜드마스터", img: "https://via.placeholder.com/100/1a1a1a/ff4444?text=그마" },
            { level: 75, title: "마스터 (Master)", img: "https://via.placeholder.com/100/1a1a1a/aa00ff?text=마스터" },
            { level: 60, title: "장인 (Expert)", img: "https://via.placeholder.com/100/1a1a1a/ff8800?text=장인" },
            { level: 45, title: "초고수 (Pro)", img: "https://via.placeholder.com/100/1a1a1a/00aaff?text=초고수" },
            { level: 30, title: "고수 (Advanced)", img: "https://via.placeholder.com/100/1a1a1a/00ea90?text=고수" },
            { level: 15, title: "중수 (Intermediate)", img: "https://via.placeholder.com/100/1a1a1a/00ea90?text=중수" },
            { level: 1, title: "초보자 (Beginner)", img: "https://via.placeholder.com/100/1a1a1a/00ea90?text=초보자" }
        ];

        let savedNickname = "플레이어";
        let currentLevel = 1;
        let currentExp = 0;
        let maxExp = 100;

        // --- 데이터 저장 함수 ---
        function saveData() {
            const data = {
                nickname: savedNickname,
                level: currentLevel,
                exp: currentExp,
                maxExp: maxExp,
                buttonsHTML: document.getElementById('action-buttons').innerHTML // 버튼 상태 그대로 저장
            };
            localStorage.setItem('myRpgData', JSON.stringify(data));
        }

        // --- 데이터 불러오기 함수 ---
        function loadData() {
            const saved = localStorage.getItem('myRpgData');
            if (saved) {
                const data = JSON.parse(saved);
                savedNickname = data.nickname;
                currentLevel = data.level;
                currentExp = data.exp;
                maxExp = data.maxExp;

                // 화면에 데이터 적용
                document.getElementById('display-name').innerText = savedNickname;
                document.getElementById('rpg-name').innerText = savedNickname;
                document.getElementById('action-buttons').innerHTML = data.buttonsHTML;

                // 화면 전환 (1, 2단계 건너뛰고 3단계로)
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('mode-select-screen').style.display = 'none';
                document.getElementById('main-portal').style.display = 'block';

                updateUI();
                return true; // 저장된 데이터가 있음
            }
            return false; // 저장된 데이터가 없음
        }

        // --- 초기화 함수 ---
        function resetData() {
            if (confirm("정말로 모든 진행 상황을 초기화하시겠습니까?")) {
                localStorage.removeItem('myRpgData');
                location.reload(); // 새로고침하여 처음 화면으로
            }
        }

        // 페이지가 열릴 때 자동으로 저장된 데이터가 있는지 확인
        window.onload = function() {
            loadData();
        };

        function goToModeSelect() {
            let nicknameInput = document.getElementById('nickname-input').value.trim();
            if (nicknameInput !== "") savedNickname = nicknameInput;

            document.getElementById('welcome-name').innerText = savedNickname;
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('mode-select-screen').style.display = 'flex';
        }

        function startPortal(mode) {
            document.getElementById('display-name').innerText = savedNickname;
            document.getElementById('rpg-name').innerText = savedNickname;

            let actionButtons = document.getElementById('action-buttons');
            actionButtons.innerHTML = ""; 

            if (mode === 'default') {
                actionButtons.innerHTML = `
                    <button class="action-btn" onclick="gainExp(500)">💻 파이썬 API 테스트 (+500)</button>
                    <button class="action-btn" onclick="gainExp(35)">🏋️ 체형 개선 스트레칭 (+35)</button>
                    <button class="action-btn" onclick="gainExp(15)">⌨️ 키보드 타건 및 세팅 (+15)</button>
                `;
            } else if (mode === 'custom') {
                actionButtons.innerHTML = `<p style="font-size: 13px; color: #aaa; width: 100%; margin: 5px 0;">아직 퀘스트가 없습니다. 아래 버튼을 눌러 추가해보세요!</p>`;
            }

            document.getElementById('mode-select-screen').style.display = 'none';
            document.getElementById('main-portal').style.display = 'block';
            
            updateUI();
            saveData(); // 초기 세팅 완료 시 저장
        }

        function gainExp(amount) {
            currentExp += amount;
            
            let leveledUp = false;
            while (currentExp >= maxExp) {
                currentLevel++;
                currentExp = currentExp - maxExp;
                maxExp = Math.floor(maxExp * 1.2);
                leveledUp = true;
                
                let matchedRank = rankSystem.find(r => r.level === currentLevel);
                if (matchedRank) {
                    alert(`🎊 승급 달성! [${matchedRank.title}] 랭크가 되었습니다!`);
                }
            }
            
            if (leveledUp) {
                alert(`🎉 레벨업! Lv.${currentLevel}이(가) 되었습니다.`);
            }
            
            updateUI();
            saveData(); // 경험치를 얻을 때마다 자동 저장
        }

        function updateUI() {
            document.getElementById('level-display').innerText = `Lv. ${currentLevel}`;
            document.getElementById('exp-text').innerText = `${currentExp} / ${maxExp} EXP`;
            let expPercentage = (currentExp / maxExp) * 100;
            document.getElementById('exp-bar-fill').style.width = `${expPercentage}%`;

            let currentRank = rankSystem.find(r => currentLevel >= r.level);
            
            document.getElementById('rank-text').innerText = currentRank.title;
            document.getElementById('rank-image').src = currentRank.img;
        }

        function toggleTaskForm() {
            let form = document.getElementById('custom-task-form');
            let toggleBtn = document.getElementById('toggle-form-btn');
            
            if (form.style.display === 'none') {
                form.style.display = 'block';
                toggleBtn.style.display = 'none';
            } else {
                form.style.display = 'none';
                toggleBtn.style.display = 'block';
            }
        }

        function addCustomTask() {
            let taskNameInput = document.getElementById('new-task-name');
            let taskExpInput = document.getElementById('new-task-exp');
            let taskName = taskNameInput.value.trim();
            let taskExp = parseInt(taskExpInput.value);

            if (taskName === "" || isNaN(taskExp) || taskExp <= 0) {
                alert("퀘스트 이름과 1 이상의 경험치를 입력해주세요!");
                return;
            }

            let actionButtons = document.getElementById('action-buttons');
            if (actionButtons.innerHTML.includes("<p")) {
                actionButtons.innerHTML = "";
            }

            // HTML 문자열로 직접 추가해야 저장 기능과 충돌하지 않음
            actionButtons.innerHTML += `<button class="action-btn" onclick="gainExp(${taskExp})">📌 ${taskName} (+${taskExp})</button>`;

            taskNameInput.value = "";
            taskExpInput.value = "";
            toggleTaskForm();
            
            saveData(); // 퀘스트를 추가할 때마다 자동 저장
        }
    </script>
</body>
</html>
